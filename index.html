<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relajación Switch</title>

    <style>
        body {
            margin: 0;
            background: #111;
            font-family: system-ui;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .phone {
            width: 420px;
            height: 90vh;
            background: #f5f7fb;
            border-radius: 32px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, .35);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }

        .levels-grid {
            background: white;
            border-radius: 16px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            border: 1px solid #ddd;
        }

        .level-card {
            background: #f9fafc;
            border-radius: 10px;
            padding: 6px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #ddd;
        }

        .level-card.completed {
            background: #e6ffe9;
            border-color: #35c759;
        }

        .progress {
            background: white;
            border-radius: 16px;
            padding: 10px;
            border: 1px solid #ddd;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e3e6f2;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2f6df6, #35c759);
            transition: width .3s;
        }
    </style>
</head>

<body>

    <div class="phone">

        <div class="top-bar">
            <div>
                Usuario:
                <select id="userSelect">
                    <option value="1">Papa</option>
                    <option value="2">Mama</option>
                    <option value="3">Romeo</option>
                    <option value="4">Avril</option>
                </select>
            </div>
            <span id="userStatus">Papa · 0/8</span>
        </div>

        <div class="levels-grid" id="levelsGrid">
            <div class="level-card" data-level="1">🐉<br>Dragón</div>
            <div class="level-card" data-level="2">🚦<br>Semáforo</div>
            <div class="level-card" data-level="3">🦸<br>Superhéroe</div>
            <div class="level-card" data-level="4">📦<br>Caja</div>
            <div class="level-card" data-level="5">🎈<br>Globo</div>
            <div class="level-card" data-level="6">🤖<br>Robot</div>
            <div class="level-card" data-level="7">📓<br>Diario</div>
            <div class="level-card" data-level="8">⏱️<br>Minuto</div>
        </div>

        <div class="progress">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

    </div>

    <script>
        const users = { 1: "Papa", 2: "Mama", 3: "Romeo", 4: "Avril" };

        async function getCloudData() {
            const res = await fetch(
                "https://raw.githubusercontent.com/gabrielrpalavecino-dotcom/relajacion/main/data/progreso.json"
            );
            return await res.json();
        }

        async function loadUser(userId) {
            const data = await getCloudData();
            const user = data[userId];

            document.getElementById("userStatus").textContent =
                `${users[userId]} · ${user.completed.length}/8`;

            document.querySelectorAll(".level-card").forEach(card => {
                const lvl = parseInt(card.dataset.level);
                card.classList.toggle("completed", user.completed.includes(lvl));
            });

            document.getElementById("progressFill").style.width =
                (user.completed.length / 8 * 100) + "%";
        }

        document.getElementById("userSelect").addEventListener("change", e => {
            loadUser(e.target.value);
        });

        document.getElementById("levelsGrid").addEventListener("click", async e => {
            const card = e.target.closest(".level-card");
            if (!card) return;

            const lvl = parseInt(card.dataset.level);
            const userId = document.getElementById("userSelect").value;

            const data = await getCloudData();
            const user = data[userId];

            if (!user.completed.includes(lvl)) {
                user.completed.push(lvl);
                alert("Para guardar el progreso, GitHub Actions debe actualizar el JSON.");
                loadUser(userId);
            }
        });

        loadUser(1);
    </script>

</body>

</html>
