<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relajación · Switch</title>

    <style>
        :root {
            --bg: #f5f7fb;
            --card: #fff;
            --primary: #2f6df6;
            --accent: #ffcc00;
            --text: #222;
            --muted: #777;
            --joycon-red: #ff4b4b;
            --joycon-blue: #4bb4ff;
            --border: #e0e4f0;
            --success: #35c759;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone {
            width: 90vw;
            max-width: 420px;
            height: 90vh;
            background: var(--bg);
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, .35);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text);
        }

        .user-select select {
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: #fff;
        }

        .joycons {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .joycon {
            width: 60px;
            height: 120px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
        }

        .joycon.red {
            background: var(--joycon-red);
        }

        .joycon.blue {
            background: var(--joycon-blue);
        }

        .header {
            flex: 1;
            margin: 0 8px;
            background: var(--primary);
            border-radius: 16px;
            padding: 10px 12px;
            color: #fff;
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
        }

        .header-title {
            font-size: 16px;
            font-weight: 700;
        }

        .header-sub {
            background: var(--accent);
            color: #333;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            width: fit-content;
        }

        .header-coins {
            position: absolute;
            right: 10px;
            top: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .coin {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid #f0b000;
        }

        .levels-grid {
            background: var(--card);
            border-radius: 16px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            border: 1px solid var(--border);
        }

        .level-card {
            background: #f9fafc;
            border-radius: 10px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-align: center;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .level-icon {
            font-size: 20px;
        }

        .level-title {
            font-size: 10px;
            font-weight: 600;
            color: var(--text);
        }

        .level-tag {
            font-size: 9px;
            color: var(--muted);
        }

        .level-star {
            font-size: 11px;
            color: var(--accent);
        }

        .level-card.completed {
            background: #e6ffe9;
            border-color: var(--success);
        }

        .progress {
            background: var(--card);
            border-radius: 16px;
            padding: 10px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .progress-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text);
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            border-radius: 999px;
            background: #e3e6f2;
            overflow: hidden;
        }

        .progress-fill {
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--success));
            transition: width .3s;
        }

        .controls {
            background: var(--card);
            border-radius: 16px;
            padding: 10px;
            border: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            align-items: center;
            gap: 8px;
        }

        .btn-circle {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: var(--text);
            background: #f9fafc;
            cursor: pointer;
        }

        .btn-main {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #e3f3ff;
            border: 3px solid var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            cursor: pointer;
        }

        .btn-main-icon {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #cfe8ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .bottom-nav {
            margin-top: auto;
            background: var(--card);
            border-radius: 16px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--muted);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .nav-icon {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            background: #e3e8ff;
        }

        .xp-bar {
            width: 80px;
            height: 8px;
            border-radius: 999px;
            background: #e3e6f2;
            overflow: hidden;
        }

        .xp-fill {
            width: 0;
            height: 100%;
            background: #35c759;
            transition: width .3s;
        }
    </style>
</head>

<body>

    <div class="phone">

        <div class="top-bar">
            <div class="user-select">
                Usuario:
                <select id="userSelect">
                    <option value="1">Papa</option>
                    <option value="2">Mama</option>
                    <option value="3">Romeo</option>
                    <option value="4">Avril</option>
                </select>
            </div>
            <small id="userStatus">Usuario: Papa · Progreso: 0 / 8</small>
        </div>

        <div class="joycons">
            <div class="joycon red"><span>L</span></div>

            <div class="header">
                <div class="header-title">Juegos de Relajación</div>
                <div class="header-sub">8 Niveles</div>
                <div class="header-coins">
                    <div class="coin"></div>
                    <span id="coinCount">100</span>
                </div>
            </div>

            <div class="joycon blue"><span>R</span></div>
        </div>

        <div class="levels-grid" id="levelsGrid">
            <div class="level-card" data-level="1">
                <div class="level-icon">🐉</div>
                <div class="level-title">Dragón</div>
                <div class="level-tag">Respira</div>
            </div>
            <div class="level-card" data-level="2">
                <div class="level-icon">🚦</div>
                <div class="level-title">Semáforo</div>
                <div class="level-tag">Control</div>
            </div>
            <div class="level-card" data-level="3">
                <div class="level-icon">🦸</div>
                <div class="level-title">Superhéroe</div>
                <div class="level-tag">Fuerza</div>
            </div>
            <div class="level-card" data-level="4">
                <div class="level-icon">📦</div>
                <div class="level-title">Caja Calma</div>
                <div class="level-tag">Objetos</div>
            </div>
            <div class="level-card" data-level="5">
                <div class="level-icon">🎈</div>
                <div class="level-title">Globo</div>
                <div class="level-tag">Aire</div>
            </div>
            <div class="level-card" data-level="6">
                <div class="level-icon">🤖</div>
                <div class="level-title">Robot</div>
                <div class="level-tag">Tensión</div>
            </div>
            <div class="level-card" data-level="7">
                <div class="level-icon">📓</div>
                <div class="level-title">Diario</div>
                <div class="level-tag">Escribir</div>
            </div>
            <div class="level-card" data-level="8">
                <div class="level-icon">⏱️</div>
                <div class="level-title">Minuto</div>
                <div class="level-tag">60s</div>
            </div>
        </div>

        <div class="progress">
            <div class="progress-top">
                <span id="levelLabel">Nivel 0</span>
                <span id="levelCount">0 / 8</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="progress" id="misionBox">
            <div class="progress-top">
                <span>Misión diaria</span>
                <span id="misionEstado">Pendiente</span>
            </div>
            <div id="misionTexto" style="font-size:12px;color:#333;margin-top:6px;">
                Cargando misión...
            </div>
        </div>

        <div class="controls">
            <button class="btn-circle" id="btnStart">A<br>Iniciar</button>
            <button class="btn-main" id="btnRespira">
                <div class="btn-main-icon">💧</div>
                <span>Respira</span>
            </button>
            <button class="btn-circle" id="btnExit">B<br>Salir</button>
        </div>

        <div class="bottom-nav">
            <div class="nav-item">
                <div class="nav-icon"></div>
                <span>Inicio</span>
            </div>
            <div class="nav-item">
                <span id="xpLabel">XP 0</span>
                <div class="xp-bar">
                    <div class="xp-fill" id="xpFill"></div>
                </div>
            </div>
            <div class="nav-item">
                <div class="nav-icon"></div>
                <span>Logros</span>
            </div>
        </div>

    </div>

    <!-- Modal -->
    <div id="modal"
        style="position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:center;">
        <div style="background:white;padding:20px;width:80%;max-width:300px;border-radius:16px;text-align:center;">
            <h3 id="modalTitulo"></h3>
            <p id="modalTexto" style="margin:10px 0;"></p>
            <button id="modalAccion"
                style="padding:10px 20px;border-radius:12px;border:none;background:#2f6df6;color:white;font-weight:bold;">Acción</button>
            <br><br>
            <button onclick="cerrarModal()"
                style="padding:6px 14px;border-radius:12px;border:none;background:#ccc;font-size:12px;">Cerrar</button>
        </div>
    </div>

    <script>
        /* Explicaciones */
        const TIP_EXPLICACIONES = {
            1: {titulo: "Respiración del Dragón", texto: "Inhala profundo y exhala largo como un dragón.", accion: "respirar"},
            2: {titulo: "Semáforo Emocional", texto: "Rojo: paro. Amarillo: pienso. Verde: actúo.", accion: "pausa"},
            3: {titulo: "Superhéroe Fuerte", texto: "Postura de superhéroe durante 1 minuto.", accion: "postura"},
            4: {titulo: "Caja de Calma", texto: "Usa objetos que te tranquilizan.", accion: "sensorial"},
            5: {titulo: "Globo Gigante", texto: "Cada respiración infla un globo imaginario enorme.", accion: "respirar"},
            6: {titulo: "Robot y Gelatina", texto: "Tensa el cuerpo como robot y luego suéltalo.", accion: "tensar"},
            7: {titulo: "Diario de Aventuras", texto: "Escribe tu día como misión épica.", accion: "escribir"},
            8: {titulo: "Minuto Tranquilo", texto: "Respira lento durante 60 segundos.", accion: "cronometro"}
        };

        /* Misiones */
        const MISIONES = [
            {id: 1, texto: "Respiración del Dragón 3 veces", accion: "respirar"},
            {id: 2, texto: "Semáforo emocional 2 ciclos", accion: "pausa"},
            {id: 3, texto: "Postura de superhéroe 1 minuto", accion: "postura"},
            {id: 4, texto: "Caja de calma 20 segundos", accion: "sensorial"},
            {id: 5, texto: "Globo gigante 5 respiraciones", accion: "respirar"},
            {id: 6, texto: "Robot y gelatina 3 ciclos", accion: "tensar"},
            {id: 7, texto: "Escribir 1 misión en el diario", accion: "escribir"},
            {id: 8, texto: "Minuto tranquilo completo", accion: "cronometro"}
        ];

        function generarMisionDiaria() {
            const r = Math.floor(Math.random() * MISIONES.length);
            return {
                fecha: new Date().toISOString().split("T")[0],
                ...MISIONES[r],
                completada: false
            };
        }

        function abrirModal(tipId) {
            const tip = TIP_EXPLICACIONES[tipId];
            document.getElementById("modalTitulo").textContent = tip.titulo;
            document.getElementById("modalTexto").textContent = tip.texto;
            document.getElementById("modalAccion").onclick = () => ejecutarAccion(tip.accion);
            document.getElementById("modal").style.display = "flex";
        }

        function cerrarModal() {
            document.getElementById("modal").style.display = "none";
        }

        function ejecutarAccion(tipo) {
            switch (tipo) {
                case "respirar": alert("Respirá 4 segundos, exhalá 6."); break;
                case "pausa": alert("Pausa de 10 segundos."); break;
                case "postura": alert("Postura de superhéroe durante 1 minuto."); break;
                case "sensorial": alert("Elegí un objeto que te calme."); break;
                case "tensar": alert("Tensá 5 segundos y soltá."); break;
                case "escribir": alert("Escribí tu misión del día."); break;
                case "cronometro": alert("60 segundos de calma."); break;
            }
        }

        const users = {1: "Papa", 2: "Mama", 3: "Romeo", 4: "Avril"};

        const userSelect = document.getElementById("userSelect");
        const levelsGrid = document.getElementById("levelsGrid");
        const progressFill = document.getElementById("progressFill");
        const levelLabel = document.getElementById("levelLabel");
        const levelCount = document.getElementById("levelCount");
        const xpLabel = document.getElementById("xpLabel");
        const xpFill = document.getElementById("xpFill");
        const userStatus = document.getElementById("userStatus");

        /* 🔥 LLAMADAS A GITHUB ACTIONS */
        async function getCloudData() {
            const res = await fetch(
                "https://api.github.com/repos/gabrielrpalavecino-dotcom/relajacion/contents/data/progreso.json",
                {headers: {"Accept": "application/vnd.github+json"}}
            );
            const data = await res.json();
            return JSON.parse(atob(data.content));
        }

        async function saveCloudData(newData) {
            await fetch(
                "https://api.github.com/repos/gabrielrpalavecino-dotcom/relajacion/actions/workflows/update.yml/dispatches",
                {
                    method: "POST",
                    headers: {
                        "Accept": "application/vnd.github+json",
                        "Authorization": "Bearer GH_TOKEN_REEMPLAZAR"
                    },
                    body: JSON.stringify({
                        ref: "main",
                        inputs: {
                            userId: "1",
                            newData
